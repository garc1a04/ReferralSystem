version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql_referrals
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/docker/data

volumes:
  mysql_data: